spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true

  rabbitmq:
    host: localhost
    port: 5672

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

# Stub out external provider configs so beans can be created
flutterwave:
  secret-key: test-secret
  public-key: test-public
  base-url: http://localhost
  encryption-key: test-encryption

paystack:
  secret-key: test-secret
  public-key: test-public
  base-url: http://localhost
  default-currency: NGN

interswitch:
  client-id: test
  secret: test
  merchant-code: test
  pay-item-id: test
  base-url: http://localhost
  mode: test